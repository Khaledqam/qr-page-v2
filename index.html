<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AtoZ.ps — أبو زهرة للإلكترونيات</title>
<meta name="description" content="وجهتك الأولى في فلسطين — إلكترونيات، أجهزة كهربائية، اكسسوارات">
<meta name="robots" content="index, follow">
<!-- Open Graph -->
<meta property="og:title" content="AtoZ Store — أبو زهرة للإلكترونيات">
<meta property="og:description" content="وجهتك الأولى في فلسطين — Expect More...">
<meta property="og:type" content="website">
<meta property="og:url" content="https://qr.atoz.ps/">
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<!-- Stylesheet -->
<link rel="stylesheet" href="assets/css/style.css?v=3">
<!--TRACKING_HEAD_PLACEHOLDER-->
</head>
<body>

<!-- Ambient background orbs (purely decorative) -->
<div class="bg-orb bg-orb--1" aria-hidden="true"></div>
<div class="bg-orb bg-orb--2" aria-hidden="true"></div>
<div class="bg-orb bg-orb--3" aria-hidden="true"></div>

<div class="page" id="page">

  <!-- ===== Header ===== -->
  <header class="profile">
    <div class="profile__logo-wrap" id="logoWrap">
      <img class="profile__logo" id="logoImg"
           src="assets/img/icons/icon_7cca60e9826a1b4d.jpg"
           alt="شعار AtoZ Store"
           onerror="this.style.opacity='0'">
    </div>
    <h1 class="profile__name" id="storeName">AtoZ Store</h1>
    <p class="profile__tagline" id="taglineText">وجهتك الأولى في فلسطين | Expect More...</p>
    <div class="profile__bio" id="bioText"></div>

    <!-- Micro-buttons: website + phone -->
    <div class="profile__micro-btns" id="microBtns">
      <a class="micro-btn" id="websiteBtn" href="https://www.AtoZ.ps" target="_blank" rel="noopener noreferrer" hidden>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10A15.3 15.3 0 0 1 8 12a15.3 15.3 0 0 1 4-10z"/></svg>
        <span id="websiteLabel">www.AtoZ.ps</span>
      </a>
      <a class="micro-btn" id="phoneBtn" href="tel:1700111222" hidden>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.65 3.38 2 2 0 0 1 3.62 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.56A16 16 0 0 0 16 16.56l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span id="phoneLabel">1700 111 222</span>
      </a>
    </div>
  </header>

  <!-- ===== Tab Switcher ===== -->
  <nav class="tabs" role="tablist" aria-label="أقسام الصفحة">
    <button class="tab tab--active" role="tab" aria-selected="true"
            aria-controls="panel-links" id="tab-links" data-panel="links">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      روابطنا
    </button>
    <button class="tab" role="tab" aria-selected="false"
            aria-controls="panel-branches" id="tab-branches" data-panel="branches">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      فروعنا
    </button>
  </nav>

  <!-- ===== Links Panel ===== -->
  <section id="panel-links" role="tabpanel" aria-labelledby="tab-links" class="panel panel--active">

    <!-- App store block — injected here if position=top -->
    <div id="appBlockTop" hidden></div>

    <nav class="links" id="linksList" aria-label="روابط التواصل">
      <!-- Skeleton placeholders while loading -->
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
    </nav>

    <!-- App store block — injected here if position=bottom (default) -->
    <div id="appBlockBottom" hidden></div>

  </section>

  <!-- ===== Branches Panel ===== -->
  <section id="panel-branches" role="tabpanel" aria-labelledby="tab-branches" class="panel" hidden>
    <div id="branchesList" class="branches-list">
      <div class="skeleton-card" aria-hidden="true"></div>
      <div class="skeleton-card" aria-hidden="true"></div>
    </div>
  </section>

  <!-- ===== Footer ===== -->
  <footer class="page__footer">
    <span id="footerText">AtoZ Store © <span id="year"></span></span>
  </footer>

</div><!-- .page -->

<script src="assets/js/main.js?v=3"></script>
<!--TRACKING_BODY_PLACEHOLDER-->
</body>
</html>
